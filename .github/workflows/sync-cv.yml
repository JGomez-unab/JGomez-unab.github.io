name: Sync CV and publications

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-cv
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6

      - name: Check out private CV source
        uses: actions/checkout@v6
        with:
          repository: JGomez-unab/CV-Jgomez
          ref: main
          token: ${{ secrets.CV_REPO_TOKEN }}
          path: _cv_source
          persist-credentials: false

      - name: Apply AltaCV compatibility adjustment
        shell: python
        run: |
          from pathlib import Path

          sidebar = Path("_cv_source/page4sidebar.tex")
          content = sidebar.read_text(encoding="utf-8")
          content = content.replace(r"\begin{itemize}", r"\begin{flushleft}\small", 1)
          content = content.replace(r"\end{itemize}", r"\end{flushleft}", 1)
          content = content.replace(r"\item ", "\n" + r"\par\noindent ")
          sidebar.write_text(content, encoding="utf-8")

      - name: Compile CV with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: isso.tex
          working_directory: _cv_source
          latexmk_use_xelatex: true

      - name: Generate publications page
        run: |
          python -m pip install --disable-pip-version-check bibtexparser==1.4.3
          python scripts/sync_cv.py --bib _cv_source/sample.bib --output publications.html

      - name: Publish CV PDF
        run: |
          mkdir -p downloads
          cp _cv_source/isso.pdf downloads/Juan-Sebastian-Gomez-Quintero-CV.pdf

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html downloads/Juan-Sebastian-Gomez-Quintero-CV.pdf
          git diff --cached --quiet || git commit -m "Update CV and publications"
          git push
