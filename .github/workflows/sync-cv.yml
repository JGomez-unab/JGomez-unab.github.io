name: Sync CV and publications

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-cv
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6

      - name: Check out private CV source
        uses: actions/checkout@v6
        with:
          repository: JGomez-unab/CV-Jgomez
          ref: main
          token: ${{ secrets.CV_REPO_TOKEN }}
          path: _cv_source
          persist-credentials: false

      - name: Generate publications page
        run: |
          python -m pip install --disable-pip-version-check bibtexparser==1.4.3
          python scripts/sync_cv.py --bib _cv_source/sample.bib --output publications.html

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.html
          git diff --cached --quiet || git commit -m "Update CV and publications"
          git push
